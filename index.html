<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#14161A">
<title>Calculator</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculator">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#14161A; color:#E8E6E1;
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:1.2rem; }
  .box { width:100%; max-width:22rem; }
  h1 { font-size:1rem; font-weight:600; margin:0 0 1rem; color:#A3A7AE; letter-spacing:.02em; }
  input { width:100%; padding:.75rem .85rem; font-size:1rem; color:#E8E6E1; background:#1C1F25;
          border:1px solid #2C313A; border-radius:6px; }
  input:focus { outline:2px solid #F0B241; outline-offset:1px; }
  button { width:100%; margin-top:.6rem; padding:.75rem 1rem; font-size:1rem; font-weight:600; cursor:pointer;
           color:#1A1200; background:#F0B241; border:0; border-radius:6px; }
  button:disabled { opacity:.6; cursor:default; }
  label { display:flex; gap:.5rem; align-items:center; margin-top:.7rem; font-size:.85rem; color:#6E737B; }
  .msg { margin-top:.7rem; font-size:.85rem; min-height:1.2em; color:#6E737B; }
  .msg.err { color:#E5484D; }
</style>
</head>
<body>
<div class="box">
  <h1>Locked</h1>
  <form id="f" autocomplete="off">
    <input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" enterkeyhint="go" autofocus>
    <label><input id="r" type="checkbox" style="width:auto" checked> Stay unlocked on this device</label>
    <button id="b" type="submit">Unlock</button>
  </form>
  <div class="msg" id="m"></div>
</div>
<script>
(function () {
  var K = 'k.v1';
  var $ = function (id) { return document.getElementById(id); };
  function msg(t, err) { var m = $('m'); m.textContent = t || ''; m.className = err ? 'msg err' : 'msg'; }
  function ub64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  if (!(window.crypto && window.crypto.subtle)) {
    msg('This page needs a secure connection (https).', true);
    $('b').disabled = true;
    return;
  }

  // Register the worker BEFORE unlocking. document.write tears the document down,
  // which cancels a registration still in flight, so wait for it to settle first.
  var swReady = ('serviceWorker' in navigator)
    ? navigator.serviceWorker.register('./sw.js').catch(function () {})
    : Promise.resolve();

  var envP = fetch('./app.enc', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('missing payload');
    return r.json();
  });

  function unlock(pass, remember) {
    msg('Unlocking...');
    return swReady.then(function () { return envP; }).then(function (env) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
        .then(function (km) {
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: ub64(env.salt), iterations: env.iter, hash: 'SHA-256' },
            km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        })
        .then(function (key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(env.iv) }, key, ub64(env.ct));
        })
        .then(function (buf) {
          var html = new TextDecoder().decode(buf);
          if (remember) { try { localStorage.setItem(K, pass); } catch (e) {} }
          else { try { localStorage.removeItem(K); } catch (e) {} }
          document.open(); document.write(html); document.close();
        });
    });
  }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('p').value;
    if (!v) return;
    $('b').disabled = true;
    unlock(v, $('r').checked).catch(function () {
      msg('Incorrect.', true);
      $('b').disabled = false;
      $('p').select();
    });
  });

  var saved = null;
  try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved) unlock(saved, true).catch(function () { try { localStorage.removeItem(K); } catch (e) {} msg(''); });
})();
</script>
</body>
</html>
