<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#14161A">
<title>Notes</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes">
<style>
  :root { color-scheme: dark; --bg:#14161A; --ink:#E8E6E1; --key:#2A2F37; --key2:#3A414B; --amber:#F0B241; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ---------- calculator ---------- */
  .calc { height:100dvh; max-width:26rem; margin:0 auto; padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
          display:flex; flex-direction:column; }
  .out { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;
         padding:0 .5rem 1rem; min-height:0; }
  .prev { font-size:1.05rem; color:#8A9099; min-height:1.4em; font-variant-numeric:tabular-nums;
          overflow:hidden; text-overflow:ellipsis; max-width:100%; white-space:nowrap; }
  .disp { font-size:clamp(2.6rem, 15vw, 4rem); font-weight:300; letter-spacing:-.02em; line-height:1.1;
          font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; max-width:100%; white-space:nowrap; }
  .pad { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; }
  .pad button { aspect-ratio:1/1; border:0; border-radius:50%; background:var(--key); color:var(--ink);
                font-size:clamp(1.3rem,6vw,1.7rem); font-weight:400; cursor:pointer; transition:filter .12s; }
  .pad button:active { filter:brightness(1.45); }
  .pad .fn { background:var(--key2); }
  .pad .op { background:var(--amber); color:#1A1200; font-weight:600; }
  .pad .wide { aspect-ratio:auto; grid-column:span 2; border-radius:2.2rem; }
  button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }

  /* ---------- panel ---------- */
  .pnl { position:fixed; inset:0; background:#0B0D10; display:none; place-items:center; z-index:20; }
  .pnl.on { display:grid; }
  .stage { position:relative; width:min(78vw,22rem); aspect-ratio:1/1; perspective:1100px; }
  .glow { position:absolute; inset:-30%; border-radius:50%; opacity:0;
          background:radial-gradient(circle, rgba(240,178,65,.95) 0%, rgba(240,178,65,.35) 35%, transparent 70%); }
  .door { position:absolute; inset:0; transform-origin:left center; transform-style:preserve-3d; }
  .beam { position:absolute; inset:0; opacity:0; background:
          conic-gradient(from 200deg at 50% 50%, transparent 0deg, rgba(255,225,170,.55) 18deg, transparent 42deg,
                         transparent 180deg, rgba(255,225,170,.45) 200deg, transparent 226deg); filter:blur(6px); }
  /* Every animated element is a plain div. CSS animations on SVG child
     elements are unreliable on older WebKit, so the SVGs only ever draw. */
  .plate, .bolts, .handle { position:absolute; inset:0; }
  .pnl svg { position:absolute; inset:0; width:100%; height:100%; }
  .cap { position:absolute; left:0; right:0; bottom:-3.2rem; text-align:center; font-size:.9rem; color:#6E737B; opacity:0; }

  @keyframes spin  { to { transform:rotate(1080deg); } }
  @keyframes bolts { to { transform:scale(.62); opacity:.55; } }
  @keyframes swing { 0%{transform:rotateY(0)} 100%{transform:rotateY(-118deg) translateZ(30px)} }
  @keyframes flare { 0%{opacity:0} 55%{opacity:1} 100%{opacity:.85} }
  @keyframes rise  { to { opacity:1 } }
  @keyframes wash  { 0%{opacity:0} 70%{opacity:1} 100%{opacity:1} }

  .go .handle { animation:spin 1.15s cubic-bezier(.6,.05,.25,1) forwards; }
  .go .bolts { animation:bolts .5s ease-in .95s forwards; }
  .go .door { animation:swing 1.15s cubic-bezier(.5,0,.2,1) 1.35s forwards; }
  .go .glow { animation:flare 1.5s ease-out 1.35s forwards; }
  .go .beam { animation:rise 1.1s ease-out 1.6s forwards; }
  .go .cap  { animation:rise .6s ease-out 2.3s forwards; }
  .go .white { animation:wash .75s ease-in 2.5s forwards; }
  .white { position:fixed; inset:0; background:#F7EBD4; opacity:0; pointer-events:none; z-index:25; }

  @media (prefers-reduced-motion: reduce) {
    .go .handle,.go .bolts,.go .door,.go .glow,.go .beam,.go .cap { animation-duration:.01s; animation-delay:0s; }
    .go .white { animation-duration:.01s; animation-delay:.05s; }
  }

  /* ---------- passphrase ---------- */
  .gate { position:fixed; inset:0; background:var(--bg); display:none; place-items:center; padding:1.2rem; z-index:30; }
  .gate.on { display:grid; }
  .gate .box { width:100%; max-width:22rem; }
  .gate h1 { font-size:1rem; font-weight:600; margin:0 0 1rem; color:#A3A7AE; }
  .gate input[type=password] { width:100%; padding:.75rem .85rem; font-size:1rem; color:var(--ink);
        background:#1C1F25; border:1px solid #2C313A; border-radius:6px; }
  .gate button { width:100%; margin-top:.6rem; padding:.75rem 1rem; font-size:1rem; font-weight:600;
        color:#1A1200; background:var(--amber); border:0; border-radius:6px; cursor:pointer; }
  .gate label { display:flex; gap:.5rem; align-items:center; margin-top:.7rem; font-size:.85rem; color:#6E737B; }
  .msg { margin-top:.7rem; font-size:.85rem; min-height:1.2em; color:#6E737B; }
  .msg.err { color:#E5484D; }
</style>
</head>
<body>

<div class="calc" id="calc">
  <div class="out">
    <div class="prev" id="prev"></div>
    <div class="disp" id="disp">0</div>
  </div>
  <div class="pad" id="pad">
    <button class="fn" data-k="C">AC</button>
    <button class="fn" data-k="neg">+/−</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="wide" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="op" data-k="=">=</button>
  </div>
</div>

<div class="pnl" id="pnl">
  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="beam"></div>
    <div class="door">
      <div class="plate">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="steel" cx="38%" cy="32%">
              <stop offset="0%" stop-color="#4A525D"/><stop offset="60%" stop-color="#333A44"/><stop offset="100%" stop-color="#20252C"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="96" fill="url(#steel)" stroke="#565F6B" stroke-width="2"/>
          <circle cx="100" cy="100" r="80" fill="none" stroke="#1B1F25" stroke-width="3"/>
          <circle cx="100" cy="100" r="66" fill="none" stroke="#4A525D" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="bolts">
        <svg viewBox="0 0 200 200" aria-hidden="true" fill="#6E7783">
          <circle cx="100" cy="16" r="5"/><circle cx="159" cy="41" r="5"/><circle cx="184" cy="100" r="5"/>
          <circle cx="159" cy="159" r="5"/><circle cx="100" cy="184" r="5"/><circle cx="41" cy="159" r="5"/>
          <circle cx="16" cy="100" r="5"/><circle cx="41" cy="41" r="5"/>
        </svg>
      </div>
      <div class="handle">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="15" fill="#5A6472" stroke="#8892A0" stroke-width="2"/>
          <g stroke="#8892A0" stroke-width="7" stroke-linecap="round">
            <line x1="100" y1="100" x2="100" y2="52"/><line x1="100" y1="100" x2="148" y2="100"/>
            <line x1="100" y1="100" x2="100" y2="148"/><line x1="100" y1="100" x2="52" y2="100"/>
          </g>
          <circle cx="100" cy="100" r="7" fill="#F0B241"/>
        </svg>
      </div>
    </div>
    <div class="cap" id="cap">Opening</div>
  </div>
</div>
<div class="white" id="white"></div>

<div class="gate" id="gate">
  <div class="box">
    <h1>Passphrase</h1>
    <form id="f" autocomplete="off">
      <input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" enterkeyhint="go">
      <label><input id="r" type="checkbox" style="width:auto" checked> Stay unlocked on this device</label>
      <button id="b" type="submit">Open</button>
    </form>
    <div class="msg" id="m"></div>
  </div>
</div>

<script>
(function () {
  // Where the remembered passphrase lives.
  //
  // This used to be called K, and two hundred lines further down `var K` is
  // declared a second time, in the same scope, for the entry-code hashes. So
  // by the time anything read it the passphrase key was the whole hash array
  // stringified. It worked, because both the read and the write used the same
  // wrong thing — and it would have stopped working silently the first time
  // an entry code was ever changed. Named properly now, and the old key is
  // migrated rather than abandoned, so nobody has to type anything again.
  var PASSKEY = 'k.v1';
  var $ = function (id) { return document.getElementById(id); };
  function savedPass() {
    try {
      var v = localStorage.getItem(PASSKEY);
      if (v) return v;
      var legacy = localStorage.getItem(String(K));
      if (legacy) {
        localStorage.setItem(PASSKEY, legacy);
        localStorage.removeItem(String(K));
        return legacy;
      }
    } catch (e) {}
    return null;
  }
  function ub64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function msg(t, err) { var m = $('m'); m.textContent = t || ''; m.className = err ? 'msg err' : 'msg'; }

  /* ---------------- calculator ---------------- */
  var cur = '0', prevVal = null, op = null, fresh = true;
  function fmt(n) {
    if (!isFinite(n)) return 'Error';
    var s = String(Math.round(n * 1e12) / 1e12);
    return s.length > 14 ? Number(n).toPrecision(10).replace(/\.?0+e/, 'e') : s;
  }
  function draw() { $('disp').textContent = cur; $('prev').textContent = op ? (fmt(prevVal) + ' ' + ({ '+': '+', '-': '−', '*': '×', '/': '÷' })[op]) : ''; }
  function apply(a, b, o) { return o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : b === 0 ? NaN : a / b; }
  function press(k) {
    if (k >= '0' && k <= '9') { cur = (fresh || cur === '0') ? k : cur + k; fresh = false; }
    else if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (cur.indexOf('.') < 0) cur += '.'; }
    else if (k === 'C') { cur = '0'; prevVal = null; op = null; fresh = true; }
    else if (k === 'neg') { cur = cur.charAt(0) === '-' ? cur.slice(1) : (cur === '0' ? cur : '-' + cur); }
    else if (k === 'pct') { cur = fmt(parseFloat(cur) / 100); fresh = true; }
    else if (k === '+' || k === '-' || k === '*' || k === '/') {
      var v = parseFloat(cur);
      prevVal = (op && !fresh) ? apply(prevVal, v, op) : v;
      cur = fmt(prevVal); op = k; fresh = true;
    } else if (k === '=') {
      verify(cur);
      if (op) { cur = fmt(apply(prevVal, parseFloat(cur), op)); op = null; prevVal = null; }
      fresh = true;
    }
    draw();
  }
  $('pad').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k);
  });
  document.addEventListener('keydown', function (e) {
    if ($('gate').classList.contains('on')) return;
    var k = e.key;
    if (/^[0-9.]$/.test(k)) press(k);
    else if (k === '+' || k === '-' || k === '*' || k === '/') press(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
    else if (k === 'Escape') press('C');
    else if (k === 'Backspace') { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; if (cur === '-') cur = '0'; draw(); }
  });
  draw();

  /* Stored as digests, not values, so reading this file reveals nothing —
     including which slot is which, since only an index is written down. The
     final digit of the entry code selects the slot, so who you are is decided
     before anything opens and cannot be mis-tapped afterwards. */
  var K = [
    ['df2f15a05a56ffdb5edd93edd407ea3711197448c139479a5f793f42367934c4',
     'b3b5fe3e601f63160ada6393d78ec80d50e9334aa952c20c9d8a706c07662607'],
    ['28acb7c4454398ec858af385aebcd774924dbcc5925ead4629be4997d4ba7897',
     'fa801a6524f4c1f2cd331f0d506351580d9c7fe4fdf9a343f4cb15cefddf490e']
  ];
  // The AI account, decided by the entry code in verify() below: true when the
  // code that was typed ends in 1. That account skips the chooser and opens the
  // AI room directly.
  var soloAi = false;
  var digestOk = !!(window.crypto && window.crypto.subtle && crypto.subtle.digest);
  function verify(v) {
    if (!digestOk || !v) return;
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (buf) {
      var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
      for (var i = 0; i < K.length; i++) {
        if (K[i].indexOf(hex) > -1) {
          try { localStorage.setItem('calc.pref', String(i)); } catch (e) {}
          // An entry code ending in 1 is the AI account: it goes straight to the
          // AI room, no chooser. Read from the code actually typed, before
          // anything opens, so it cannot be changed afterwards.
          soloAi = /1$/.test(v);
          cur = '0'; prevVal = null; op = null; fresh = true; draw();
          openPanel();
          return;
        }
      }
    }).catch(function () {});
  }

  var opened = false;
  function openPanel() {
    if (opened) return; opened = true;
    $('pnl').classList.add('on');
    // A timer rather than requestAnimationFrame: rAF gets throttled in
    // background tabs and low-power mode, which would leave the door frozen.
    setTimeout(function () { $('stage').classList.add('go'); $('white').classList.add('go'); }, 30);
    var wait = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 3050;
    setTimeout(afterPanel, wait);
  }
  function afterPanel() {
    var saved = savedPass();
    if (saved) {
      unlock(saved, true).catch(function () {
        opening = false;
        try { localStorage.removeItem(PASSKEY); } catch (e) {}
        showGate();
      });
    } else showGate();
  }
  function showGate() {
    $('white').style.animation = 'none'; $('white').style.opacity = 0;
    $('pnl').classList.remove('on');
    $('gate').classList.add('on');
    setTimeout(function () { $('p').focus(); }, 50);
  }

  /* Without a secure context nothing further is available. */
  if (!(window.crypto && window.crypto.subtle)) { K = []; }
  var swReady = ('serviceWorker' in navigator)
    ? navigator.serviceWorker.register('./sw.js').catch(function () {})
    : Promise.resolve();
  var envP = null;
  function payload() {
    if (!envP) envP = fetch('./app.enc', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('missing'); return r.json();
    });
    return envP;
  }
  // Spaces and capitals are ignored, so every way of typing it opens the same door.
  function normPass(p) { return String(p).toLowerCase().replace(/\s+/g, ''); }
  // document.write() replaces the document but does not cancel the timers the
  // cover already set. afterPanel fires three seconds after the entry code, so a
  // passphrase submitted before then gets a second unlock on top of the first:
  // the whole app and question bank parsed twice, the second parse dying on a
  // duplicate const. One door, one opening.
  var opening = false;
  function unlock(pass, remember) {
    if (opening) return Promise.resolve();
    opening = true;
    return swReady.then(payload).then(function (env) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(normPass(pass)), 'PBKDF2', false, ['deriveKey'])
        .then(function (km) {
          return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub64(env.salt), iterations: env.iter, hash: 'SHA-256' },
            km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        })
        .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(env.iv) }, key, ub64(env.ct)); })
        .then(function (buf) {
          var html = new TextDecoder().decode(buf);
          // Hand the key to the app in memory. The window object outlives the
          // document rewrite below, so this reaches the app and nothing else,
          // and it is never persisted.
          try { window.__vk = pass; } catch (e) {}
          if (remember) { try { localStorage.setItem(PASSKEY, pass); } catch (e) {} }
          else { try { localStorage.removeItem(PASSKEY); } catch (e) {} }
          // The AI account skips the chooser entirely and opens the AI room.
          // On the AI page that is a straight document rewrite; from another
          // room it is a hop to the AI page, which #go then opens without a
          // second ritual.
          if (soloAi) {
            // MODE is the shell's own identity for the directory it serves, so
            // the AI shell (the root) is MODE 'ai' regardless of the AI room's
            // dir being '' in the config. On it, load the AI app in place.
            if (MODE === 'ai') { enter(html); return; }
            // From another room, hop to the AI page; #go opens it there.
            readCfg(html);
            var ai = ROOMS.filter(function (r) { return r.id === 'ai'; })[0];
            location.href = (ai ? ai.path : UP) + '#go';
            return;
          }
          // One door, then a choice of rooms. Arriving with #go means the
          // choice has already been made on the way in, so do not ask twice.
          if (location.hash === '#go') { enter(html); return; }
          chooser(html);
        });
    });
  }
  /* ---------------------------------------------------------------- rooms
     Three subjects behind one passphrase, and one door into all of them.
     The link approach did not work: a link in a sidebar under a collapsed
     "Everything else" is not a way in, it is a thing to be found, and it was
     not found. So the choice is now unavoidable and comes before anything
     else, every single time the door opens.

     Each subject gets its own colour, and it carries through into the app
     itself as a bar across the top. That is not decoration. Three sets of
     facts learned in the same room blur together; the same three learned in
     rooms that look different do not, and this app is entirely in the business
     of keeping facts apart from each other. */
  /* The labels are NOT in this file.

     They cannot be. This file is served in the clear to anyone who loads the
     page, and the first version of this chooser spelled all of it out right
     here in the open -- which the audit caught and refused to deploy,
     correctly. The whole point of the disguise is that someone who finds the
     page learns nothing, and a short list of names and dates is very nearly
     the whole of it.

     So the rooms travel inside the ciphertext. Nothing below is known until a
     correct passphrase has decrypted the payload. */
  var MODE = 'ai', UP = '';
  var ROOMS = [], EVENTS = [], RHYTHM = null;
  function readCfg(html) {
    if (ROOMS.length) return;
    var m = html.match(/<!--R:([A-Za-z0-9+/=]+)-->/);
    if (!m) return;
    try {
      var j = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      // A room's DIRECTORY and its NAME are deliberately different things.
      // The directory is in the URL and in this file, both of which are public;
      // the name is not. So this file knows only that it is sitting in a folder
      // called "b", and what "b" is for arrives with the decrypted config.
      //
      // (The first draft of this very comment named the subject out loud, and
      // the builder refused to write the file. Working as intended.)
      ROOMS = (j.rooms || []).map(function (r) {
        return { id: r.id, dir: r.dir, label: r.label, sub: r.sub, col: r.col,
          path: r.path ? UP + r.path : UP, off: r.off };
      });
      EVENTS = j.events || [];
      RHYTHM = j.rhythm || null;
    } catch (e) { ROOMS = []; EVENTS = []; RHYTHM = null; }
  }
  function enter(html, mode) {
    readCfg(html);
    var m = ROOMS.filter(function (r) { return (r.dir != null ? r.dir : r.id) === (mode || MODE); })[0];
    if (m) {
      // A stripe the app itself never has to know about.
      //
      // APPENDED, not spliced into the head: these bundles are bare fragments
      // that open on <title> and carry no <head> or <body> tag at all, so
      // replacing '</head>' matched nothing and silently did nothing. Appended
      // at the end it also lands after the app's own stylesheet, so it wins
      // without needing !important.
      html += '<style>body{border-top:3px solid ' + m.col + ' !important}</style>';
    }
    // Two things injected into the running app. First, keep it current without a
    // manual refresh: the bundle is a static file with an ETag, so when a new one
    // is deployed the ETag changes and we reload straight back in via #go (which
    // skips the entry code and passphrase), never mid-check, never on the data
    // sync. HEAD is not a GET, so the service worker passes the probe through.
    // Second, hide-to-calculator: a per-device toggle in the account rail (on by
    // default). When on, backgrounding or closing the app reloads WITHOUT #go,
    // which lands on the calculator and asks for the entry code again on return —
    // so the app switcher and the next open show a calculator, not the study app.
    html += '<scr'+'ipt>(function(){try{'
      + 'var b=null,a=false,updating=false,leaving=false;'
      + 'function h(cb){fetch("./app.enc",{method:"HEAD",cache:"no-store"}).then(function(r){cb((r.headers.get("etag")||r.headers.get("last-modified")||"").trim());}).catch(function(){cb("");});}'
      + 'function busy(){var q=document.getElementById("quiz-run"),r=document.getElementById("quiz-result");return !!((q&&!q.hidden)||(r&&!r.hidden));}'
      + 'function ck(){if(!a||!b||busy())return;h(function(v){if(v&&v!==b){updating=true;try{if(location.hash!=="#go")location.hash="#go";}catch(e){}location.reload();}});}'
      + 'h(function(v){b=v;a=true;});'
      + 'setInterval(ck,120000);'
      + 'function locked(){try{return localStorage.getItem("calc.lockOnLeave")!=="0";}catch(e){return true;}}'
      + 'function toCalc(){if(leaving||updating||!locked())return;leaving=true;try{location.replace(location.pathname+location.search);}catch(e){try{location.href=location.pathname;}catch(_){}}}'
      + 'try{var rail=document.querySelector(".acct");if(rail&&!document.getElementById("lock-leave")){var lb=document.createElement("label");lb.className="tiny muted";lb.setAttribute("style","display:flex;gap:0.45rem;align-items:center;margin-top:0.5rem;cursor:pointer");var ci=document.createElement("input");ci.type="checkbox";ci.id="lock-leave";ci.setAttribute("style","width:auto;flex:none;margin:0");ci.checked=locked();ci.addEventListener("change",function(){try{localStorage.setItem("calc.lockOnLeave",ci.checked?"1":"0");}catch(e){}});lb.appendChild(ci);lb.appendChild(document.createTextNode(" Hide to the calculator when the app is closed"));rail.appendChild(lb);}}catch(e){}'
      + 'document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(locked())toCalc();else ck();}else{toCalc();}});'
      + 'window.addEventListener("pagehide",function(){toCalc();});'
      + 'window.addEventListener("pageshow",function(e){if(e&&e.persisted){leaving=false;if(locked())toCalc();else ck();}});'
      + '}catch(e){}})();</scr'+'ipt>';
    document.open(); document.write(html); document.close();
  }
  function chooser(html) {
    readCfg(html);
    if (!ROOMS.length) { enter(html); return; }   // nothing to choose between
    var wrap = document.createElement('div');
    // Centred with `margin:auto` on the child rather than `align-items:center`
    // on the parent. They look identical until the content is taller than the
    // screen, at which point centring from the parent clips the top off and
    // refuses to scroll to it — which is exactly what the week rhythm did to
    // this panel on a phone.
    wrap.setAttribute('style', 'position:fixed;inset:0;z-index:99;background:#0d1117;color:#e6edf3;' +
      'display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.2rem;' +
      'font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif');
    var box = document.createElement('div');
    box.setAttribute('style', 'width:100%;max-width:30rem;margin:auto');
    var h = document.createElement('div');
    h.setAttribute('style', 'font-size:0.78rem;letter-spacing:0.09em;text-transform:uppercase;opacity:0.5;margin-bottom:0.8rem');
    h.textContent = 'What are you working on?';
    box.appendChild(h);
    ROOMS.forEach(function (r) {
      // Whether a room exists yet is decided in the payload, not named here.
      var live = r.off ? false : true;
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('style', 'display:block;width:100%;text-align:left;margin-bottom:0.6rem;' +
        'padding:0.95rem 1.05rem;border-radius:11px;cursor:' + (live ? 'pointer' : 'default') + ';' +
        'background:#161b22;color:inherit;font:inherit;min-height:56px;' +
        'border:1px solid ' + (live ? r.col : '#30363d') + ';' +
        'border-left:5px solid ' + (live ? r.col : '#30363d') + ';opacity:' + (live ? '1' : '0.42'));
      var t = document.createElement('div');
      t.setAttribute('style', 'font-weight:650;font-size:1.06rem;color:' + (live ? r.col : 'inherit'));
      t.textContent = r.label;
      var s = document.createElement('div');
      s.setAttribute('style', 'font-size:0.82rem;opacity:0.62');
      s.textContent = r.off || r.sub;
      b.appendChild(t); b.appendChild(s);
      if (live) b.addEventListener('click', function () {
        if (r.id === 'all') { showAll(wrap, html); return; }
        // A room whose path is empty is this very page: the AI room on the AI
        // shell, whose dir is '' while this shell's MODE is 'ai', so the dir
        // test below never catches it. Open it in place. Falling through to
        // '#go' with an empty path only set the hash and reloaded nothing,
        // which is why the AI tile did nothing when clicked.
        if (!r.path || (r.dir != null ? r.dir : r.id) === MODE) { enter(html); return; }
        location.href = r.path + '#go';
      });
      box.appendChild(b);
    });
    wrap.appendChild(box);
    document.body.appendChild(wrap);
  }
  /* The combined view: what is next, across all three, without opening any of
     them. Four events in thirty days is the real hazard, and it is the one
     thing none of the three apps can show on its own. */
  function showAll(wrap, html) {
    var DAY = 864e5;
    var EV = EVENTS;                              // from the ciphertext, never from this file
    var now = new Date();
    var html2 = '';

    // Which one to open tonight.
    //
    // Every app answers "what next" inside its own subject and none of them
    // answers this, which is the only question that exists once three are
    // running. It leads because it is the one thing here that is actionable
    // within the next hour; the countdowns below are context, not instructions.
    var RH = RHYTHM;
    if (RH && RH.days) {
      var colOf = function (id) {
        var r = ROOMS.filter(function (x) { return x.id === id; })[0];
        return r ? r.col : '#8b949e';
      };
      var labOf = function (id) {
        var r = ROOMS.filter(function (x) { return x.id === id; })[0];
        return r ? r.label : 'Either';
      };
      var today = RH.days.filter(function (x) { return x.d === now.getDay(); })[0];
      var iso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      var phase = (RH.phases || []).filter(function (p) { return p[0] >= iso; })[0];

      html2 += '<div style="font-size:0.78rem;letter-spacing:0.09em;text-transform:uppercase;opacity:0.5;margin-bottom:0.6rem">Tonight</div>';
      if (RH.daily) {
        html2 += '<div style="display:flex;justify-content:space-between;gap:0.8rem;padding:0.6rem 0.9rem;' +
          'margin-bottom:0.5rem;border-radius:9px;background:#161b22;border-left:5px solid ' + colOf(RH.daily.room) + '">' +
          '<span><b style="color:' + colOf(RH.daily.room) + '">Every day &middot; ' + RH.daily.what + '</b>' +
          '<br><span style="font-size:0.78rem;opacity:0.6">' + RH.daily.why + '</span></span>' +
          '<span style="font-size:0.85rem;opacity:0.6;white-space:nowrap">' + RH.daily.mins + ' min</span></div>';
      }
      if (today) {
        html2 += '<div style="display:flex;justify-content:space-between;gap:0.8rem;padding:0.8rem 0.9rem;' +
          'margin-bottom:0.5rem;border-radius:9px;background:#1c2128;border:1px solid ' + colOf(today.room) + ';' +
          'border-left:5px solid ' + colOf(today.room) + '">' +
          '<span><b style="color:' + colOf(today.room) + ';font-size:1.05rem">' + labOf(today.room) + '</b>' +
          '<br><span style="font-size:0.85rem;opacity:0.75">' + today.what + '</span></span>' +
          '<span style="font-size:0.85rem;opacity:0.6;white-space:nowrap">' + today.mins + ' min</span></div>';
      }
      if (phase) html2 += '<div style="font-size:0.8rem;opacity:0.62;margin:0 0 1rem">' + phase[1] + '</div>';

      // The rest of the week, so it reads as a shape rather than a nag.
      html2 += '<div style="font-size:0.78rem;letter-spacing:0.09em;text-transform:uppercase;opacity:0.5;margin-bottom:0.5rem">The week</div>';
      var NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      RH.days.forEach(function (x) {
        var is = x.d === now.getDay();
        html2 += '<div style="display:flex;gap:0.7rem;align-items:baseline;padding:0.3rem 0.5rem;border-radius:6px;' +
          (is ? 'background:#161b22;' : '') + 'font-size:0.85rem;opacity:' + (is ? '1' : '0.62') + '">' +
          '<span style="width:2.4rem;opacity:0.7">' + NAMES[x.d] + '</span>' +
          '<span style="width:0.55rem;height:0.55rem;border-radius:50%;background:' + colOf(x.room) + ';flex:0 0 auto"></span>' +
          '<span style="flex:1">' + x.what + '</span>' +
          '<span style="opacity:0.55;white-space:nowrap">' + x.mins + '′</span></div>';
      });
      if (RH.note) html2 += '<div style="font-size:0.78rem;opacity:0.5;margin:0.7rem 0 1.2rem">' + RH.note + '</div>';
    }

    html2 += '<div style="font-size:0.78rem;letter-spacing:0.09em;text-transform:uppercase;opacity:0.5;margin-bottom:0.9rem">Everything, by date</div>';
    EV.forEach(function (e) {
      var d = Math.ceil((new Date(e[1] + 'T00:00:00') - now) / DAY);
      html2 += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.8rem;' +
        'padding:0.7rem 0.9rem;margin-bottom:0.5rem;border-radius:9px;background:#161b22;border-left:5px solid ' + e[2] + '">' +
        '<span><b style="color:' + e[2] + '">' + e[0] + '</b><br><span style="font-size:0.8rem;opacity:0.6">' +
        new Date(e[1] + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'long', day: 'numeric' }) + '</span></span>' +
        '<span style="font-variant-numeric:tabular-nums;font-size:1.5rem">' + (d < 0 ? 'done' : d) + '</span></div>';
    });
    if (EV.length > 1) {
      var span = Math.ceil((new Date(EV[EV.length - 1][1] + 'T00:00:00') - new Date(EV[0][1] + 'T00:00:00')) / DAY);
      var gap = Math.ceil((new Date(EV[1][1] + 'T00:00:00') - new Date(EV[0][1] + 'T00:00:00')) / DAY);
      html2 += '<div style="font-size:0.8rem;opacity:0.55;margin:0.6rem 0 1rem">' + span +
        ' days hold all ' + EV.length + '. The squeeze is the start: the second one lands ' + gap +
        ' days after the first.</div>';
    }
    var back = '<button type="button" id="__back" style="width:100%;padding:0.8rem;border-radius:10px;' +
      'background:#161b22;border:1px solid #30363d;color:#e6edf3;font:inherit;cursor:pointer;min-height:44px">Back</button>';
    wrap.firstChild.innerHTML = html2 + back;
    document.getElementById('__back').addEventListener('click', function () {
      wrap.parentNode.removeChild(wrap);
      chooser(html);
    });
  }

  /* Coming through from the other room.

     The rooms are separate directories, so choosing one is a real navigation
     and the shell there starts from the top: calculator, entry code, door,
     passphrase. Which means picking a subject cost him the whole ritual a
     second time, thirty seconds after doing it once. The door has already been
     opened; #go says so. Skip the cover and go straight to the stored
     passphrase — and if there is not one stored, straight to the box, without
     the three-second animation in front of it. */
  if (location.hash === '#go') {
    try { $('calc').style.display = 'none'; } catch (e) {}
    opened = true;
    afterPanel();
  }

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('p').value; if (!v) return;
    $('b').disabled = true; msg('Opening...');
    unlock(v, $('r').checked).catch(function () {
      opening = false;
      msg('Incorrect.', true); $('b').disabled = false; $('p').select();
    });
  });

  /* Every visit starts on this screen, including when a passphrase is already
     stored. The stored value is applied after the entry sequence, so nothing
     has to be typed twice. */
})();
</script>
</body>
